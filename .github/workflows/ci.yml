name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working directory
        uses: actions/checkout@v3

      - uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - run: agda index.agda
        working-directory: src
