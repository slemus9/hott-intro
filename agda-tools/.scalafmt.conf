version = "3.11.5"
runner.dialect = scala3

preset = default
align.preset = most

maxColumn = 100
project.includePaths = ["glob:**.scala", "glob:**.sbt", "glob:**.sc", "glob:**.mill"]

rewrite {
  scala3 {
    convertToNewSyntax = false
    removeOptionalBraces = false
    insertEndMarkerMinLines = 30
    removeEndMarkerMaxLines = 3
  }
  rules = [Imports]
  imports {
    groups = [
      ["[a-z].*"],
      ["java\\..*", "scala\\..*"],
    ]
    sort = original
  }
  trailingCommas.style = never
}
